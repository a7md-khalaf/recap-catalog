<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#151515"><title>إضافة محتوى</title>
<link rel="stylesheet" href="style.css">
<style>
body{padding:16px;max-width:560px;margin:0 auto}
h1{font-size:22px}h2{font-size:17px;margin:22px 0 8px}
label{display:block;margin:12px 0 4px;font-size:14px;color:#ccc}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font:inherit;font-size:16px}
textarea{min-height:110px;direction:ltr;text-align:left}
button{margin-top:14px;padding:13px 18px;border:0;border-radius:10px;background:#e8503a;color:#fff;font:inherit;font-size:16px;width:100%}
button.sec{background:#333}button.del{background:#7a1f1f}
.box{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:14px;margin-top:16px}
#msg{position:sticky;top:0;padding:12px;border-radius:10px;margin:10px 0;display:none;font-size:15px}
.ok{background:#14532d}.err{background:#7a1f1f}
small{color:#999;display:block;margin-top:4px}
</style></head><body>
<h1>إضافة محتوى للموقع</h1>
<div id="msg"></div>

<div class="box" id="tokenBox">
<h2>الدخول (مرة واحدة)</h2>
<label>مفتاح GitHub (Token)</label>
<input id="token" type="password" autocomplete="off" placeholder="github_pat_...">
<button id="saveToken">حفظ المفتاح على هذا الجهاز</button>
<small id="tokState"></small>
</div>

<div id="main" style="display:none">
<div class="box">
<h2>١) إضافة عمل جديد</h2>
<label>اسم العمل</label><input id="nTitle" maxlength="120">
<label>النوع</label><select id="nType"><option>مسلسل</option><option>فيلم</option><option>أنمي</option><option>برنامج</option></select>
<label>الملخص (اختياري)</label><textarea id="nDesc" style="direction:rtl;text-align:right;min-height:80px" maxlength="1000"></textarea>
<label>رابط البوستر (اختياري، رابط صورة https)</label><input id="nPoster" dir="ltr" inputmode="url">
<label>الحلقات: كل حلقة في سطر بالشكل: اسم الحلقة | رابط أو كود التضمين</label>
<textarea id="nEps" placeholder="الحلقة 1 | https://mp4plus.org/embed-xxxx.html&#10;الحلقة 2 | https://youtu.be/xxxx"></textarea>
<small>الفيلم: سطر واحد فقط.</small>
<button id="addShow">إضافة العمل</button>
</div>

<div class="box">
<h2>٢) إضافة حلقات لعمل موجود</h2>
<label>اختر العمل</label><select id="eShow"></select>
<label>الحلقات (سطر لكل حلقة: اسم | رابط)</label>
<textarea id="eEps"></textarea>
<button id="addEps">إضافة الحلقات</button>
</div>

<div class="box">
<h2>٣) حذف عمل</h2>
<select id="dShow"></select>
<button class="del" id="delShow">حذف العمل نهائياً</button>
</div>
<button class="sec" id="logout">مسح المفتاح من هذا الجهاز</button>
</div>

<script src="site-config.js"></script>
<script src="app.js"></script>
<script>
const $=id=>document.getElementById(id);
const REPO=RC.repo, BR=RC.branch, API=`https://api.github.com/repos/${REPO}/contents/data.json`;
const tk=()=>localStorage.getItem('rc_token')||'';
function msg(t,ok){const m=$('msg');m.textContent=t;m.className=ok?'ok':'err';m.style.display='block';m.scrollIntoView({block:'center'});}
function hdr(){return{Authorization:'Bearer '+tk(),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
function dec(b64){const bin=atob(b64.replace(/\n/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));}
function enc(s){let b='';new TextEncoder().encode(s).forEach(c=>b+=String.fromCharCode(c));return btoa(b);}
async function getData(){
  const r=await fetch(`${API}?ref=${BR}&t=${Date.now()}`,{headers:hdr(),cache:'no-store'});
  if(r.status===401||r.status===403||r.status===404)throw new Error('المفتاح غير صالح أو منتهي أو ما عنده صلاحية على المستودع. اعمل مفتاح جديد.');
  if(!r.ok)throw new Error('تعذر قراءة المحتوى ('+r.status+')');
  const j=await r.json();const d=JSON.parse(dec(j.content));
  if(!d||!Array.isArray(d.shows))throw new Error('ملف المحتوى غير سليم، لم يتم أي تعديل.');
  return{d,sha:j.sha};
}
async function putData(d,sha,note){
  const body={message:note,content:enc(JSON.stringify(d,null,2)+'\n'),sha,branch:BR};
  const r=await fetch(API,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr()),body:JSON.stringify(body)});
  if(r.status===409||r.status===422)throw new Error('حصل تعارض، حاول مرة ثانية.');
  if(!r.ok)throw new Error('فشل الحفظ ('+r.status+')');
}
function cleanEmbed(v){
  const u=embedUrl(v);
  let x;try{x=new URL(u);}catch(e){return null;}
  if(x.protocol!=='https:'||!x.hostname.includes('.'))return null;
  return u;
}
function parseEps(txt){
  const lines=txt.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length)throw new Error('اكتب حلقة واحدة على الأقل.');
  if(lines.length>300)throw new Error('عدد الحلقات كبير، أضفها على دفعات.');
  return lines.map((l,i)=>{
    const k=l.indexOf('|');
    if(k<1)throw new Error(`السطر ${i+1}: لازم الشكل: اسم الحلقة | الرابط`);
    const title=l.slice(0,k).trim(),emb=cleanEmbed(l.slice(k+1));
    if(!title||title.length>120)throw new Error(`السطر ${i+1}: اسم الحلقة فاضي أو طويل.`);
    if(!emb)throw new Error(`السطر ${i+1}: الرابط لازم يبدأ بـ https وصحيح.`);
    return{title,embed:emb};
  });
}
function fill(d){
  for(const id of['eShow','dShow']){$(id).innerHTML='';d.shows.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.title;$(id).appendChild(o);});}
}
async function refresh(){try{const{d}=await getData();fill(d);$('main').style.display='block';}catch(e){msg(e.message,false);}}
function busy(b,on){b.disabled=on;}
async function run(btn,fn){busy(btn,true);try{await fn();}catch(e){msg(e.message,false);}busy(btn,false);}
$('saveToken').onclick=()=>{const v=$('token').value.trim();if(!/^(github_pat_|ghp_)[\w]+$/.test(v))return msg('المفتاح شكله غلط. لازم يبدأ بـ github_pat_',false);localStorage.setItem('rc_token',v);$('token').value='';$('tokState').textContent='تم الحفظ على هذا الجهاز';refresh();};
$('logout').onclick=()=>{localStorage.removeItem('rc_token');location.reload();};
$('addShow').onclick=e=>run(e.target,async()=>{
  const title=$('nTitle').value.trim();if(!title||title.length>120)return msg('اكتب اسم العمل (حتى 120 حرف).',false);
  const desc=$('nDesc').value.trim();
  let poster=$('nPoster').value.trim();
  if(poster){try{const x=new URL(poster);if(x.protocol!=='https:')throw 0;}catch(_){return msg('رابط البوستر لازم يبدأ بـ https.',false);}}
  const episodes=parseEps($('nEps').value);
  const{d,sha}=await getData();
  if(d.shows.some(s=>s.title===title))return msg('العمل ده موجود بالفعل. استخدم خانة إضافة حلقات.',false);
  let id='s'+Date.now().toString(36);
  d.shows.push({id,title,type:$('nType').value,poster,description:desc,episodes});
  await putData(d,sha,'Add show: '+title.slice(0,60));
  ['nTitle','nDesc','nPoster','nEps'].forEach(i=>$(i).value='');
  fill(d);msg('تمت الإضافة. يظهر على الموقع خلال دقيقة تقريباً.',true);
});
$('addEps').onclick=e=>run(e.target,async()=>{
  const eps=parseEps($('eEps').value);const{d,sha}=await getData();
  const s=d.shows.find(x=>x.id===$('eShow').value);if(!s)return msg('اختر عمل.',false);
  s.episodes=(s.episodes||[]).concat(eps);
  await putData(d,sha,'Add episodes: '+s.title.slice(0,60));
  $('eEps').value='';msg('تمت إضافة '+eps.length+' حلقة.',true);
});
$('delShow').onclick=e=>run(e.target,async()=>{
  const{d,sha}=await getData();const s=d.shows.find(x=>x.id===$('dShow').value);if(!s)return msg('اختر عمل.',false);
  if(!confirm('حذف "'+s.title+'" نهائياً؟'))return;
  d.shows=d.shows.filter(x=>x!==s);await putData(d,sha,'Delete show: '+s.title.slice(0,60));fill(d);msg('تم الحذف.',true);
});
if(tk())refresh();else $('tokState').textContent='ما في مفتاح محفوظ على هذا الجهاز';
</script></body></html>
