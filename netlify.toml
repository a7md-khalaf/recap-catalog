[build]
  publish = "."
  # Builds only run when the commit message contains [deploy]. Content saves from /add never do.
  ignore = "git log -1 --pretty=%B | grep -q '[[]deploy[]]' && exit 1 || exit 0"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/add.html"
  [headers.values]
    X-Robots-Tag = "noindex"
